<!-- Source for public/assets/og-card.png -- the 1200x630 image every link
     preview shows (og:image / twitter:card).

     It used to be a full-size screenshot: 3839x2043 and 545 KB, which is
     7.8 megapixels for a card rendered about 500 px wide, and past the size
     some scrapers will fetch at all.

     Re-render it after a redesign or a new screenshot:

       cd public && python3 -m http.server 8731 &
       cp ../tools/og-card.html .
       firefox --headless --window-size 1200,630 \
               --screenshot /tmp/card.png http://127.0.0.1:8731/og-card.html
       magick /tmp/card.png -strip -define png:compression-level=9 \
              assets/og-card.png
       rm og-card.html

     It is screenshotted rather than drawn in ImageMagick so the type is the
     site's own webfonts, laid out by the same engine as the site.

     Same tokens as build-site.py's :root, and the same rule: no glow, no
     gradient, no perspective. The card is the first thing anyone sees of this
     project, and the 2026-09-13 redesign's whole argument is that the page
     shows the application rather than decorating it. It used to open on two
     radial gradients and a rotated screenshot in Space Grotesk -- a typeface
     that appears nowhere on the site and contradicted the colophon's "set in
     Manrope and JetBrains Mono, the same faces the application bundles".

     Do NOT leave this file in public/ -- it is a build input, not a page. -->
<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url("/fonts/manrope-latin.woff2") format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Manrope';src:url("/fonts/manrope-latin.woff2") format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url("/fonts/jetbrains-mono-latin.woff2") format('woff2');font-weight:400;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0E0E14;color:#E8E6F0;font-family:'Manrope',sans-serif;position:relative}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 0 0 72px;width:650px}
.lock{display:flex;align-items:center;gap:16px}
.lock img{display:block;width:44px;height:44px}
.name{font-weight:600;font-size:30px;letter-spacing:-0.01em;line-height:1}
.head{margin-top:28px;font-size:37px;line-height:1.16;font-weight:600;letter-spacing:-0.02em}
.head span{color:#B6B3C4}
.sub{margin-top:20px;font-size:21px;line-height:1.45;color:#B6B3C4;font-weight:400}
.meta{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#8A8C9E}
.meta b{color:#FFD447;font-weight:400}
/* Full-bleed on the right rather than a floating framed panel: at 1200x630 a
   2400x1278 screenshot inside a bordered box leaves 80px of empty card above
   and below it, and a link preview is too small to spend that. */
.shot{position:absolute;right:0;top:0;height:630px;width:500px;overflow:hidden}
.shot img{display:block;height:100%;width:auto;max-width:none;margin-left:-500px}
/* Short, and it only has to soften the seam: the picture sits entirely to the
   right of the text now, so nothing legible is being rescued by opacity. */
.fade{position:absolute;right:0;top:0;bottom:0;width:640px;
  background:linear-gradient(90deg,#0E0E14 0%,#0E0E14 20%,rgba(14,14,20,0.55) 34%,rgba(14,14,20,0.10) 60%,transparent 100%)}
</style></head><body>
<div class="shot"><img src="/assets/screenshot-call.png"></div>
<div class="fade"></div>
<div class="wrap">
  <div class="lock"><img src="/assets/lightning-mark.svg"><div class="name">Lightning</div></div>
  <div class="head">Lightning writes the interface.<br><span>The Rust SDK writes the Matrix.</span></div>
  <div class="sub">A native desktop Matrix client in Qt&nbsp;6 and C++20. Group calls, real threads, and search inside encrypted rooms.</div>
  <div class="meta">no telemetry&nbsp; ·&nbsp; no server of ours&nbsp; ·&nbsp; <b>GPL-3.0-or-later</b></div>
</div>
</body></html>
